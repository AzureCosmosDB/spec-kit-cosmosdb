version: 1
scaffold:
  prompt: cosmos.scaffold-saas
  language: "python"
  generated_at: "2026-07-27T17:36:00Z"

validation:
  - name: app-starts
    command: "uvicorn main:app --port 8000"
    expect: "listening on"
    timeout: 15s
  - name: health-check
    command: "curl -sf http://localhost:8000/api/health"
    expect: '{"status":"healthy"}'
  - name: crud-cycle
    script: tests/smoke.sh
  - name: tenant-isolation
    script: tests/tenant-isolation.sh

iteration:
  max_rounds: 3
  on_failure: fix-and-retry
  on_success: commit
