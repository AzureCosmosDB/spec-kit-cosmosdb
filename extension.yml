schema_version: "1.0"

extension:
  id: "cosmosdb"
  name: "Cosmos DB Intent SDK"
  version: "1.0.0"
  description: "Prescriptive prompt templates for Azure Cosmos DB that produce deterministic, best-practice code with any AI coding agent"
  author: "Theo van Kraay"
  repository: "https://github.com/TheovanKraay/spec-kit-cosmosdb"
  license: "MIT"

requires:
  speckit_version: ">=0.1.0"

provides:
  commands:
    - "speckit.cosmosdb.agent-kit"
    - "speckit.cosmosdb.api-pagination"
    - "speckit.cosmosdb.autoscale"
    - "speckit.cosmosdb.availability"
    - "speckit.cosmosdb.bulk"
    - "speckit.cosmosdb.changefeed"
    - "speckit.cosmosdb.changefeed-processor"
    - "speckit.cosmosdb.conditional-create"
    - "speckit.cosmosdb.connection"
    - "speckit.cosmosdb.container"
    - "speckit.cosmosdb.cqrs"
    - "speckit.cosmosdb.cross-partition"
    - "speckit.cosmosdb.diagnostics"
    - "speckit.cosmosdb.endpoint"
    - "speckit.cosmosdb.etag"
    - "speckit.cosmosdb.event-sourcing"
    - "speckit.cosmosdb.explain"
    - "speckit.cosmosdb.global-distribution"
    - "speckit.cosmosdb.hierarchical-pk"
    - "speckit.cosmosdb.index-policy"
    - "speckit.cosmosdb.migrate"
    - "speckit.cosmosdb.model"
    - "speckit.cosmosdb.multi-tenant"
    - "speckit.cosmosdb.pagination"
    - "speckit.cosmosdb.partition-key"
    - "speckit.cosmosdb.patch"
    - "speckit.cosmosdb.point-read"
    - "speckit.cosmosdb.query"
    - "speckit.cosmosdb.rag"
    - "speckit.cosmosdb.repository"
    - "speckit.cosmosdb.retry"
    - "speckit.cosmosdb.review"
    - "speckit.cosmosdb.scaffold"
    - "speckit.cosmosdb.scaffold-analytics"
    - "speckit.cosmosdb.scaffold-booking"
    - "speckit.cosmosdb.scaffold-chat"
    - "speckit.cosmosdb.scaffold-cms"
    - "speckit.cosmosdb.scaffold-ecommerce"
    - "speckit.cosmosdb.scaffold-inventory"
    - "speckit.cosmosdb.scaffold-iot"
    - "speckit.cosmosdb.scaffold-saas"
    - "speckit.cosmosdb.scaffold-social"
    - "speckit.cosmosdb.scaffold-workflow"
    - "speckit.cosmosdb.serialization"
    - "speckit.cosmosdb.session-state"
    - "speckit.cosmosdb.singleton"
    - "speckit.cosmosdb.stored-proc"
    - "speckit.cosmosdb.stream-query"
    - "speckit.cosmosdb.transaction"
    - "speckit.cosmosdb.ttl"
    - "speckit.cosmosdb.upsert"
    - "speckit.cosmosdb.vector"
    - "speckit.cosmosdb.vibe"

hooks:
  after_implement:
    command: "speckit.cosmosdb.review"
    optional: true
    prompt: "Review generated code against Cosmos DB best practices?"
  after_plan:
    command: "speckit.cosmosdb.agent-kit"
    optional: true
    prompt: "Apply Cosmos DB best-practice rules for this session?"

tags:
  - "azure"
  - "cosmosdb"
  - "database"
  - "nosql"
  - "vibe-coding"
